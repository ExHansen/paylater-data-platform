name: e2e

# The full stack with live traffic and every fault (about 30 minutes). Runs on main, on demand,
# or on a branch push whose head commit message contains [e2e].
on:
  push:
  workflow_dispatch:

jobs:
  e2e:
    if: >-
      github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, '[e2e]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # job level: a push that skips the job does not cancel a scenario that is running
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    env:
      PDP_PII_SALT: e2e-salt
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked --all-extras
      - run: mkdir -p reports && chmod a+rwx reports  # the Airflow container writes here too
      - name: End-to-end scenario
        run: uv run pytest -m e2e -q -s -rs
      - name: Summary
        if: always()
        run: |
          if [ -f e2e-summary.md ]; then
            cat e2e-summary.md >> "$GITHUB_STEP_SUMMARY"
            # also as an annotation: annotations are readable through the public API
            body=$(sed -e 's/%/%25/g' e2e-summary.md | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=e2e summary::${body}"
          fi
      - name: Service logs as annotations
        if: failure()
        run: |
          for service in $(docker compose --profile full ps -a --services); do
            tail=$(docker compose --profile full logs --no-color --tail 40 "$service" 2>&1 \
              | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=logs ${service}::${tail}"
          done
          docker compose --profile full ps -a
      - name: Keep logs and reports
        if: always()
        run: |
          mkdir -p e2e-artifacts
          docker compose --profile full logs --no-color > e2e-artifacts/compose.log 2>&1 || true
          cp -r reports e2e-artifacts/ 2>/dev/null || true
          cp e2e-summary.md e2e-artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ github.run_id }}
          path: e2e-artifacts
      - name: Tear down
        if: always()
        run: docker compose --profile full down --volumes
