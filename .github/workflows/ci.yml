name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: docker compose --profile core config -q
      - run: docker compose --profile full config -q

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run pytest -m "not pg and not e2e" -q

  pg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: pdp
          POSTGRES_PASSWORD: pdp
          POSTGRES_DB: pdp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pdp -d pdp_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PDP_TEST_PG_DSN: postgresql://pdp:pdp@localhost:5432/pdp_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run pytest -m pg -q -rs
